<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Programming Assessment - SkillQuest
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/assessment.css"
    >

</head>


<body>

    <!-- ================================= -->
    <!-- HEADER -->
    <!-- ================================= -->

    <header class="main-header">

        <div class="logo">
            SkillQuest
        </div>

        <nav>

            <a href="Dashboard.html">
                Dashboard
            </a>

            <a href="courses.html">
                Courses
            </a>

            <a href="profile.html">
                Profile
            </a>

            <a href="leaderboard.html">
                Leaderboard
            </a>

        </nav>

    </header>


    <!-- ================================= -->
    <!-- ASSESSMENT -->
    <!-- ================================= -->

    <main class="assessment-page">

        <a
            href="java-course.html"
            class="back-link"
        >
            ← Back to Java Course
        </a>


        <section class="assessment-header">

            <h1>
                Java Programming Assessment
            </h1>

            <p>
                Complete the programming challenge
                to finish your assessment.
            </p>

        </section>


        <!-- LOADING -->

        <p id="assessment-loading">
            Loading assessment...
        </p>


        <!-- ASSESSMENT CONTENT -->

        <section
            id="assessment-content"
            class="assessment-content"
            hidden
        >

            <h2 id="assessment-title">
                Assessment
            </h2>


            <div class="assessment-question">

                <h3>
                    Programming Challenge
                </h3>

                <p id="assessment-question">
                </p>

            </div>


            <div class="assessment-answer">

                <label for="assessment-answer">

                    Your Answer

                </label>

                <textarea
                    id="assessment-answer"
                    rows="10"
                    placeholder="Write your answer here..."
                ></textarea>

            </div>


            <button
                type="button"
                id="submit-assessment"
            >
                Submit Assessment
            </button>


            <div
                id="assessment-result"
                class="assessment-result"
                hidden
            >
            </div>

        </section>

    </main>


    <!-- ================================= -->
    <!-- FOOTER -->
    <!-- ================================= -->

    <footer class="main-footer">

        <p>
            © 2026 SkillQuest.
            Learn. Play. Grow.
        </p>

    </footer>


    <!-- ================================= -->
    <!-- AUTHENTICATION -->
    <!-- ================================= -->

    <script>

        if (
            !localStorage.getItem(
                "jwtToken"
            )
        ) {

            window.location.href =
                "login.html";

        }

    </script>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="../js/api.js"></script>

    <script src="../js/assessment.js"></script>

</body>

</html>
