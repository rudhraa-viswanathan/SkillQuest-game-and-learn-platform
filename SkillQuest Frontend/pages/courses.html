<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courses - SkillQuest</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/courses.css">
</head>

<body>

    <!-- Header -->
    <header class="main-header">

        <div class="logo">
            SkillQuest
        </div>

        <nav>
            <a href="Dashboard.html">Dashboard</a>
            <a href="courses.html" class="active">Courses</a>
            <a href="#">Leaderboard</a>
            <a href="#">Profile</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main class="courses-page">

        <section class="courses-hero">

            <h1>Explore Your Courses</h1>

            <p>
                Choose a course and continue your learning journey.

        </section>


        <!-- Courses Section -->
        <section class="courses-section">

            <div class="course-search">
                <input
                    type="text"
                    id="course-search"
                    placeholder="Search courses...">

            <div class="courses-container" id="courses-container">
            
                <!-- Course cards will be added here -->

            </div>

            <p id="no-courses-message" class="no-courses-message">
                No courses found.
            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer class="main-footer">

        <p>
            © 2026 SkillQuest. Learn. Play. Grow.
        </p>

        <a href="#">Contact & Feedback</a>

    </footer>


    <script src="../js/courses.js"></script>
